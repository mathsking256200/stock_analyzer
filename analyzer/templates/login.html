<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .register-link {
            text-align: center;
            margin-top: 15px;
        }

        .register-link a {
            text-decoration: none;
            color: #5a1fd1;
            font-weight: bold;
        }

        .modal{
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.modal-content{
    background: linear-gradient(135deg,#898ac4,#5a1fd1);
    width:400px;
    margin:15% auto;
    padding:20px;
    border-radius:8px;
    text-align:center;
}

.modal button{
    padding:8px 16px;
    margin:5px;
}

    </style>
</head>

<body>

<div class="container">
    <form method="POST">
    {% csrf_token %}

    <input type="email" name="email" placeholder="Enter Email" required>

    <input type="password" name="password" placeholder="Enter Password" required>
     <br>
    <label>
        <input type="checkbox" name="remember_me">
        Remember Me
    </label>
    <div class="link-text">
    <a href="{% url 'forgot_password' %}">Forgot Password?</a>
</div>
     <br>
    <button type="submit">Login</button>
</form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <div class="register-link">
        Don't have an account?
        <a href="#" onclick="openTerms()">Register</a>
    </div>
</div>

<div id="termsModal" class="modal">
    <div class="modal-content">

        <h3>Terms & Conditions</h3>

        <p>
        Please read our Privacy Policy before registering.
        </p>

        <label>
            <input type="checkbox" id="agreeCheckbox">
            I Understand <a href="{% url 'privacy' %}" target="_blank">Privacy Policy</a>
        </label>

        <br><br>

        <button onclick="proceedRegister()">Continue</button>
        <button onclick="closeTerms()">Cancel</button>

    </div>
</div>

<script>
    function openTerms(){
    document.getElementById("termsModal").style.display="block";
}

function closeTerms(){
    document.getElementById("termsModal").style.display="none";
}

function proceedRegister(){

    var check=document.getElementById("agreeCheckbox");

    if(!check.checked){
        alert("You must accept the Privacy Policy to continue.");
        return;
    }

    window.location.href="{% url 'register' %}";
}
</script>
</body>
</html>
