<!DOCTYPE html>
<html>
<head>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .footer {
            background: #2f2f2f;
            color: #ddd;
            margin-top: 60px;
            padding: 25px 0;
            font-family: 'Inter', Arial, sans-serif;
            font-size: 14px;
        }

        .footer-container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* middle content */
        .footer-middle {
            text-align: center;
        }

        .footer-middle h2 {
            color: white;
            margin-bottom: 8px;
        }

        /* right side links */
        .footer-right a {
            color: #ddd;
            text-decoration: none;
            margin-left: 15px;
        }

        .footer-right a:hover {
            color: white;
        }
    </style>
</head>

<body>

    <footer class="footer">
        <div class="footer-container">

            <!-- left empty space -->
            <div></div>

            <!-- middle content -->
            <div class="footer-middle">
                <h2>Stock Analyzer</h2>
                <p>Simple Stock Analysis Dashboard inspired from Screener</p>
                <p>© Copyright from Screener.in</p>
            </div>

            <!-- right side links -->
            <div class="footer-right">
                <a href="/about/">About Us</a>
                <a href="/privacy/">Privacy Policy</a>
            </div>

        </div>
    </footer>

</body>
</html>
